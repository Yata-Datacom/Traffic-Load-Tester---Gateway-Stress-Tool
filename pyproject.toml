[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-load-tester"
version = "2.0.0"
description = "Traffic Studio: TCP/UDP/TCP-SYN load testing, target diagnostics, scenarios and run history for gateway stress tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
keywords = ["network", "stress-test", "traffic-generator", "tkinter", "udp", "tcp", "icmp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
traffic-studio = "traffic_studio:main"
traffic-load-tester = "traffic_test_gui:main"

[tool.setuptools]
py-modules = ["traffic_test_gui", "traffic_studio", "traffic_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 基线门禁：只拦「真错误」（语法错 / 未定义名 / 未使用变量）——先能过，之后可按需收紧
select = ["E9", "F"]
